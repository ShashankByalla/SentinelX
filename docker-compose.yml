version: "3.9"

services:
  sentinelx:
    image: sentinelx:latest
    container_name: sentinelx
    restart: unless-stopped
    expose:
      - "8080"               # Expose internally to Nginx
    volumes:
      - ./sentinelx_data:/app/data
      - ./sentinelx_logs:/app/logs
    environment:
      - ENV=production
      - LOG_LEVEL=info
    networks:
      - sentinelx_net

  nginx:
    image: nginx:latest
    container_name: sentinelx_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sentinelx
    networks:
      - sentinelx_net

networks:
  sentinelx_net:
    driver: bridge
