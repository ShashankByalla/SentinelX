services:
  sentinelx:
    build: .                          # Build image from Dockerfile
    container_name: sentinelx
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./agent:/app/agent            # Mount entire agent directory
      - ./sentinelx_data:/app/data
      - ./sentinelx_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock   # 👈 allow docker CLI access
    environment:
      - ENV=production
      - LOG_LEVEL=info
    pid: host
    privileged: true
    networks:
      - sentinelx_net

  nginx:
    image: nginx:latest
    container_name: sentinelx_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sentinelx
    networks:
      - sentinelx_net

networks:
  sentinelx_net:
    driver: bridge
